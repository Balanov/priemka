name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Self-check on the recorded fixture
        run: |
          python -m priemka run --pack examples/pack-rag.toml --fixture examples/fixture-rag.json --out reports/ || true
      - name: Report is reproducible
        run: |
          python bench/benchmark.py --out bench/results/ci.json
